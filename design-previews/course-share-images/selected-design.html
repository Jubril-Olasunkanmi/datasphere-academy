<!doctype html>
<meta charset="utf-8">
<title>Datasphere Academy selected share-image design</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4f6;color:#193d62;font-family:Manrope,Arial,sans-serif}.intro{padding:32px 40px;max-width:1180px;margin:auto}.intro h1{margin:0 0 8px;font-size:34px}.intro p{margin:0;color:#6e8795}.share{width:1080px;height:1080px;margin:0 auto 48px;position:relative;overflow:hidden;background:#fff;padding:0}.logo{position:absolute;left:42px;top:38px;width:310px;height:105px;object-fit:cover;object-position:50% 48%;mix-blend-mode:multiply}.title{position:absolute;left:42px;top:242px;font-size:72px;line-height:1.05;letter-spacing:-.055em;margin:0;max-width:430px;color:#0a1c43}.title.long{font-size:58px;line-height:1.1}.accent{position:absolute;left:42px;top:390px;width:82px;height:7px;background:#0a9bb2}.title.long+.accent{top:390px}.desc{position:absolute;left:42px;top:455px;font-size:31px;line-height:1.3;max-width:450px;margin:0;color:#193d62}.art{position:absolute;right:45px;top:180px;width:525px;height:365px;border-radius:38px;object-fit:cover}.rule{position:absolute;left:42px;right:42px;top:575px;height:2px;background:#9bd9e6}.facts{position:absolute;left:92px;right:42px;top:615px;display:flex;gap:130px}.facts small{display:block;color:#6e8795;font-size:16px;margin-bottom:8px}.facts strong{display:block;color:#0a1c43;font-size:24px}.price{position:absolute;left:42px;top:740px;font-size:38px;color:#0a1c43}.price s{font-size:29px;font-weight:400;color:#7c8d98;margin-right:18px}.cta{position:absolute;right:60px;top:700px;background:linear-gradient(90deg,#aeeef3,#13b9db);border-radius:35px;padding:20px 58px;color:#0a1c43;font-size:24px;font-weight:700}.url{position:absolute;left:42px;top:900px;font-size:18px;color:#6e8795}.note{max-width:1080px;margin:0 auto 48px;padding:0 42px;color:#6e8795}
</style>
<div class="intro"><h1>Selected final design · Editorial Minimalism</h1><p>Five production-data previews. Generic shares intentionally omit cohort dates.</p></div>
<div id="previews"></div>
<script>
const courses=[
 {slug:'data-analytics',title:'Data Analytics',short:'Turn complex data into clear business decisions.',duration:'12 weeks',level:'Beginner',price:'₦100,000',original:'₦120,000',image:'../../public/images/courses/data-analytics.jpg'},
 {slug:'data-science',title:'Data Science',short:'Move from questions to predictive insight.',duration:'12 weeks',level:'Beginner',price:'₦100,000',original:'₦120,000',image:'../../public/images/courses/data-science.jpg'},
 {slug:'data-engineering',title:'Data Engineering',short:'Design reliable systems that move and power data.',duration:'12 weeks',level:'Beginner',price:'₦100,000',original:'₦120,000',image:'../../public/images/courses/data-engineering.png'},
 {slug:'ai-engineering',title:'AI Engineering',short:'Build useful AI applications responsibly.',duration:'14 weeks',level:'Beginner',price:'₦100,000',original:'₦120,000',image:'../../public/images/courses/ai-engineering.jpg'},
 {slug:'ai-agent-developer',title:'AI Automation & Agent Development',short:'Build AI-powered workflows, LLM apps and intelligent agents.',duration:'8 weeks',level:'Beginner',price:'₦60,000',image:'../../public/images/courses/ai-automation.jpg'}
];
document.querySelector('#previews').innerHTML=courses.map(c=>{const long=c.slug==='ai-agent-developer';return `<section class="share"><img class="logo" src="../../public/brand/datasphere-academy-logo.jpg"><h2 class="title ${long?'long':''}">${long?'AI Automation<br>&amp; Agent Development':c.title}</h2><div class="accent"></div><p class="desc">${c.short}</p><img class="art" src="${c.image}"><div class="rule"></div><div class="facts"><span><small>Level</small><strong>${c.level}</strong></span><span><small>Duration</small><strong>${c.duration}</strong></span><span><small>Format</small><strong>Live online</strong></span></div><strong class="price">${c.original?`<s>${c.original}</s>`:''}${c.price}</strong><span class="cta">Explore Course&nbsp; →</span><span class="url">datasphere-academy-site.pages.dev/courses/${c.slug}</span></section>`}).join('');
</script>
